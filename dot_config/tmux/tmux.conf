# ============================================================
# Terminal
# ============================================================

# Programs running inside tmux should see a tmux terminal.
set -g default-terminal "tmux-256color"

# Accept OSC 52 from applications (e.g. nvim) into tmux buffers and
# forward to the outer terminal when it supports OSC 52. This is what
# makes nvim's yank/paste work in every tmux window.
set -g set-clipboard on

# Ghostty supports true color.
set -as terminal-features ",xterm-ghostty:RGB"

# Pass focus changes to applications such as Neovim.
set -g focus-events on


# ============================================================
# General
# ============================================================

# Enable mouse support:
# - select panes
# - resize panes
# - scroll
# - select windows
set -g mouse on

# Keep more scrollback than tmux's small default.
set -g history-limit 100000

# Number windows and panes from 1 instead of 0.
set -g base-index 1
setw -g pane-base-index 1

# Remove gaps after closing a window.
set -g renumber-windows on

# vi-style keys in copy mode.
setw -g mode-keys vi


# ============================================================
# Neovim / responsiveness
# ============================================================

# Reduce ESC delay.
set -sg escape-time 10

# ============================================================
# Catppuccin
# ============================================================

# Dark theme.
set -g @catppuccin_flavor "mocha"

# Rounded window tabs.
set -g @catppuccin_window_status_style "rounded"

# Show the actual tmux window name instead of pane title/hostname.
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

# Load Catppuccin before configuring the status line.
# (catppuccin >= 2.x keeps catppuccin.tmux at the repo root, not in tmux/.)
run ~/.config/tmux/plugins/catppuccin/catppuccin.tmux


# ============================================================
# Status line
# ============================================================

set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100

# Window list stays in the center.
set -g status-left ""

# Current application.
set -g status-right "#{E:@catppuccin_status_application}"

# Current tmux session / project.
set -ag status-right "#{E:@catppuccin_status_session}"

# Clock.
set -ag status-right " #[fg=#{@thm_teal}] %H:%M"

# ============================================================
# Windows & panes
# ============================================================

# New windows inherit the current working directory.
bind c new-window -c "#{pane_current_path}"

# More intuitive splits.
#
# Prefix + |  -> left/right split
# Prefix + -  -> top/bottom split
unbind %
unbind '"'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ============================================================
# Pane management
# ============================================================

# Prefix + z: zoom current pane
# tmux already provides this by default.

# Prefix + q: display pane numbers
# also provided by tmux by default.

# Swap current pane with the previous / next pane.
bind < swap-pane -U
bind > swap-pane -D

# Turn the current pane into its own window.
bind ! break-pane -d

# ============================================================
# Window naming
# ============================================================

# Let tmux automatically name windows based on the active command.
setw -g automatic-rename on

# Don't let applications arbitrarily rename the window.
set -g allow-rename off

# Prefix + , manually renames the current window.
# This is already a tmux default, kept here as documentation.
bind , command-prompt -I "#W" "rename-window '%%'"

# ============================================================
# Window navigation
# ============================================================

# Prefix + Tab      -> next window
# Prefix + Shift-Tab -> previous window
bind Tab next-window
bind BTab previous-window

# Prefix + H/L also move between windows.
bind H previous-window
bind L next-window

# Quickly jump back to the last-used window.
bind Space last-window

# ============================================================
# Smart Neovim / tmux navigation
# ============================================================

# If the current pane is Neovim, forward Ctrl-h/j/k/l to
# smart-splits.nvim.
#
# Otherwise:
# - if another tmux pane exists in that direction, move there;
# - if we're already at the outer edge, pass the key through
#   to the shell/application.

bind-key -n C-h if -F '#{@pane-is-vim}' \
  { send-keys C-h } \
  { if -F '#{pane_at_left}' { send-keys C-h } { select-pane -L } }

bind-key -n C-j if -F '#{@pane-is-vim}' \
  { send-keys C-j } \
  { if -F '#{pane_at_bottom}' { send-keys C-j } { select-pane -D } }

bind-key -n C-k if -F '#{@pane-is-vim}' \
  { send-keys C-k } \
  { if -F '#{pane_at_top}' { send-keys C-k } { select-pane -U } }

bind-key -n C-l if -F '#{@pane-is-vim}' \
  { send-keys C-l } \
  { if -F '#{pane_at_right}' { send-keys C-l } { select-pane -R } }


# ============================================================
# Smart resizing
# ============================================================

# Option-h/j/k/l on macOS == Meta-h/j/k/l in tmux.

bind-key -n M-h if -F '#{@pane-is-vim}' \
  { send-keys M-h } \
  { resize-pane -L 3 }

bind-key -n M-j if -F '#{@pane-is-vim}' \
  { send-keys M-j } \
  { resize-pane -D 3 }

bind-key -n M-k if -F '#{@pane-is-vim}' \
  { send-keys M-k } \
  { resize-pane -U 3 }

bind-key -n M-l if -F '#{@pane-is-vim}' \
  { send-keys M-l } \
  { resize-pane -R 3 }


# ============================================================
# Copy mode navigation
# ============================================================

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# ============================================================
# UX
# ============================================================

# Messages stay visible slightly longer.
set -g display-time 1500

# Pane numbers stay visible a little longer.
set -g display-panes-time 1200

# Faster key sequences after the prefix.
set -g repeat-time 400


# ============================================================
# Config reload
# ============================================================

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# ============================================================
# Persistence
# ============================================================

# Automatically restore the latest saved tmux environment

# Store resurrect snapshots in the XDG data directory.
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"

# when a new tmux server starts.
set -g @continuum-restore "on"


# ============================================================
# Plugins
# ============================================================

# Install plugins into this same directory.  The Catppuccin module above is
# explicitly run from ~/.config/tmux/plugins/, so TPM must put plugins here
# too instead of its default ~/.tmux/plugins/.
set -g @tpm_path "~/.config/tmux/plugins"

set -g @plugin "tmux-plugins/tpm"

set -g @plugin "tmux-plugins/tmux-resurrect"

# Keep continuum last in the TPM plugin list.
# It hooks into status-right for automatic saving.
set -g @plugin "tmux-plugins/tmux-continuum"

# TPM must remain at the very bottom.
run "~/.config/tmux/plugins/tpm/tpm"


# ============================================================
# Project picker
# ============================================================

# Prefix + f -> project/session picker.
#
# zsh -i is intentional: `tm` is currently defined in ~/.zshrc.
# TM_PROJECT_POPUP prevents fzf from creating a second popup.
bind f display-popup \
  -E \
  -w 85% \
  -h 75% \
  -d "#{pane_current_path}" \
  "TM_PROJECT_POPUP=1 zsh -ic 'tm'"
